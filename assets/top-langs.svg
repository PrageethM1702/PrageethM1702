<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196" role="img" aria-label="Languages by Repository"><title>Languages by Repository</title><style>.t{font:600 16px "Segoe UI",Ubuntu,sans-serif;fill:#7FB3E8}.k{font:400 13px "Segoe UI",Ubuntu,sans-serif;fill:#C8DCF5}.v{font:600 13px "Segoe UI",Ubuntu,sans-serif;fill:#fff}.s{font:400 11px "Segoe UI",Ubuntu,sans-serif;fill:#6E88AB}@keyframes fi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}.r{animation:fi .5s ease-out both}@keyframes gw{from{width:0}}.b{animation:gw .9s ease-out both}</style><rect width="420" height="196" rx="10" fill="#0D1526" stroke="#1B2A4A"/><text x="22" y="32" class="t">Languages by Repository</text><g class="r" style="animation-delay:0.0s"><circle cx="28" cy="56" r="5" fill="#DA5B0B"/><text x="42" y="60" class="k">Jupyter Notebook</text><rect x="236" y="48" width="104" height="10" rx="5" fill="#1B2A4A"/><rect class="b" style="animation-delay:0.0s" x="236" y="48" width="46" height="10" rx="5" fill="#DA5B0B"/><text x="398" y="60" class="v" text-anchor="end">44%</text></g><g class="r" style="animation-delay:0.1s"><circle cx="28" cy="82" r="5" fill="#3572A5"/><text x="42" y="86" class="k">Python</text><rect x="236" y="74" width="104" height="10" rx="5" fill="#1B2A4A"/><rect class="b" style="animation-delay:0.1s" x="236" y="74" width="46" height="10" rx="5" fill="#3572A5"/><text x="398" y="86" class="v" text-anchor="end">44%</text></g><g class="r" style="animation-delay:0.2s"><circle cx="28" cy="108" r="5" fill="#4A6FA5"/><text x="42" y="112" class="k">Component Pascal</text><rect x="236" y="100" width="104" height="10" rx="5" fill="#1B2A4A"/><rect class="b" style="animation-delay:0.2s" x="236" y="100" width="6" height="10" rx="5" fill="#4A6FA5"/><text x="398" y="112" class="v" text-anchor="end">6%</text></g><g class="r" style="animation-delay:0.3s"><circle cx="28" cy="134" r="5" fill="#e16737"/><text x="42" y="138" class="k">MATLAB</te