<svg xmlns="http://www.w3.org/2000/svg" width="560" height="165" viewBox="0 0 560 165" role="img" aria-label="CONTRIBUTION STREAK"><title>CONTRIBUTION STREAK</title><defs><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70a5fd"/><stop offset="1" stop-color="#bf91f3"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#222434"/><stop offset="1" stop-color="#1a1b27"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70a5fd"/><stop offset="1" stop-color="#bf91f3"/></linearGradient></defs><style>.ti{font:700 15px "Segoe UI",Ubuntu,sans-serif;fill:#70a5fd;letter-spacing:.5px}.sub{font:400 10px "Segoe UI",Ubuntu,sans-serif;fill:#7982a9}.num{font:700 19px "Segoe UI",Ubuntu,sans-serif;fill:#fff}.lab{font:400 9px "Segoe UI",Ubuntu,sans-serif;fill:#7982a9;letter-spacing:.6px}.k{font:400 12.5px "Segoe UI",Ubuntu,sans-serif;fill:#38bdae}.v{font:700 12.5px "Segoe UI",Ubuntu,sans-serif;fill:#fff}.gr{font:700 30px "Segoe UI",Ubuntu,sans-serif;fill:#70a5fd}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.r{animation:fi .5s ease-out both}@keyframes gw{from{width:0}}.b{animation:gw .9s cubic-bezier(.2,.8,.2,1) both}@keyframes dash{from{stroke-dashoffset:var(--c)}}.ring{animation:dash 1.1s ease-out both}</style><rect width="560" height="165" rx="12" fill="url(#sheen)" stroke="#2a2e45"/><rect x="0" y="12" width="3" height="26" rx="1.5" fill="url(#edge)"/><text x="20" y="30" class="ti">CONTRIBUTION STREAK</text><text x="540" y="30" class="sub" text-anchor="end">all time</text><g class="r" style="animation-delay:0.0s"><text x="93" y="96" class="num" text-anchor="middle" style="font-size:26px">76</text><text x="93" y="132" class="lab" text-anchor="middle">ACTIVE DAYS</text><text x="93" y="148" class="sub" text-anchor="middle"></text></g><g transform="translate(280,86)"><circle r="29" fill="none" stroke="#2a2e45" stroke-width="6"/><circle class="ring" style="--c:182.2" r="29" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="3.6 178.6" transform="rotate(-90)"/><text y="8" class="gr" text-anchor="middle" style="font-size:24px">0</text></g><text x="280" y="132" class="lab" text-anchor="middle">CURRENT STREAK</text><text x="280" y="148" class="sub" text-anchor="middle">days</text><g class="r" style="animation-delay:0.2s"><text x="467" y="96" class="num" text-anchor="middle" style="font-size:26px">10</text><text x="467" y="132" class="lab" text-anchor="middle">LONGEST STREAK</text><text x="467" y="148" class="sub" text-anchor="middle">09 Mar 2025 to 18 Mar 2025</text></g><line x1="187" y1="52" x2="187" y2="152" stroke="#2a2e45"/><line x1="373" y1="52" x2="373" y2="152" stroke="#2a2e45"/></svg>