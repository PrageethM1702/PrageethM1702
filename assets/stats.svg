<svg xmlns="http://www.w3.org/2000/svg" width="420" height="195" viewBox="0 0 420 195" role="img" aria-label="GitHub Stats"><title>GitHub Stats</title><style>.t{font:600 16px "Segoe UI",Ubuntu,sans-serif;fill:#7FB3E8}.k{font:400 13px "Segoe UI",Ubuntu,sans-serif;fill:#C8DCF5}.v{font:600 13px "Segoe UI",Ubuntu,sans-serif;fill:#fff}.s{font:400 11px "Segoe UI",Ubuntu,sans-serif;fill:#6E88AB}@keyframes fi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}.r{animation:fi .5s ease-out both}@keyframes gw{from{width:0}}.b{animation:gw .9s ease-out both}</style><rect width="420" height="195" rx="10" fill="#0D1526" stroke="#1B2A4A"/><text x="22" y="32" class="t">GitHub Stats</text><g class="r" style="animation-delay:0.0s"><text x="22" y="66" class="k">Public repositories</text><text x="398" y="66" class="v" text-anchor="end">18</text></g><g class="r" style="animation-delay:0.1s"><text x="22" y="96" class="k">Total stars earned</text><text x="398" y="96" class="v" text-anchor="end">2</text></g><g class="r" style="animation-delay:0.2s"><text x="22" y="126" class="k">Total forks</text><text x="398" y="126" class="v" text-anchor="end">0</text></g><g class="r" style="animation-delay:0.3s"><text x="22" y="156" class="k">Followers</text><text x="398" y="156" class="v" text-anchor="end">3</text></g><text x="22" y="181" class="s">Generated daily &#183; no external service</text></svg>