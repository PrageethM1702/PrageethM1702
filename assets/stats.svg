<svg xmlns="http://www.w3.org/2000/svg" width="430" height="210" viewBox="0 0 430 210" role="img" aria-label="GITHUB STATS"><title>GITHUB STATS</title><defs><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB3E8"/><stop offset="1" stop-color="#3E5C8A"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16233c"/><stop offset="1" stop-color="#0D1526"/></linearGradient></defs><style>.ti{font:700 15px "Segoe UI",Ubuntu,sans-serif;fill:#7FB3E8;letter-spacing:.5px}.sub{font:400 10px "Segoe UI",Ubuntu,sans-serif;fill:#6E88AB}.num{font:700 21px "Segoe UI",Ubuntu,sans-serif;fill:#fff}.lab{font:400 9.5px "Segoe UI",Ubuntu,sans-serif;fill:#6E88AB;letter-spacing:.6px}.k{font:400 12.5px "Segoe UI",Ubuntu,sans-serif;fill:#C8DCF5}.v{font:700 12.5px "Segoe UI",Ubuntu,sans-serif;fill:#fff}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.r{animation:fi .5s ease-out both}@keyframes gw{from{width:0}}.b{animation:gw .9s cubic-bezier(.2,.8,.2,1) both}</style><rect width="430" height="210" rx="12" fill="url(#sheen)" stroke="#1E3153"/><rect x="0" y="12" width="3" height="26" rx="1.5" fill="url(#edge)"/><text x="20" y="30" class="ti">GITHUB STATS</text><text x="410" y="30" class="sub" text-anchor="end">3 yrs active</text><g class="r" style="animation-delay:0.00s"><rect x="20" y="48" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="34" y="80" class="num">285</text><text x="34" y="96" class="lab">COMMITS</text></g><g class="r" style="animation-delay:0.07s"><rect x="155" y="48" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="169" y="80" class="num">18</text><text x="169" y="96" class="lab">REPOSITORIES</text></g><g class="r" style="animation-delay:0.14s"><rect x="290" y="48" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="304" y="80" class="num">2</text><text x="304" y="96" class="lab">STARS EARNED</text></g><g class="r" style="animation-delay:0.21s"><rect x="20" y="118" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="34" y="150" class="num">3</text><text x="34" y="166" class="lab">FOLLOWERS</text></g><g class="r" style="animation-delay:0.28s"><rect x="155" y="118" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="169" y="150" class="num">16</text><text x="169" y="166" class="lab">ISSUES OPENED</text></g><g class="r" style="animation-delay:0.35s"><rect x="290" y="118" width="130" height="62" rx="8" fill="#132038" stroke="#1E3153"/><text x="304" y="150" class="num">4</text><text x="304" y="166" class="lab">LANGUAGES</text></g><text x="20" y="198" class="sub">Generated daily from the GitHub API</text></svg>